<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF4; --panel:#FFFFFF; --panel2:#F3F5F9; --line:#D8DEE8; --ink:#0E1A2F; --muted:#586479;
  --amber:#FFB020; --amber-ink:#1B1300; --amber-text:#96580A;
  --led-bg:#0A1120; --led-tile:#111B31; --led:#FFB824; --led-neg:#FF7B7B; --led-label:#93A3C2;
  --good:#12844A; --bad:#C42F3D;
  --nfl:#3D7BFF; --mlb:#E5414F; --nba:#F28C28; --nhl:#25B0C4;
  --shadow:0 1px 2px rgba(14,26,47,.05),0 10px 28px rgba(14,26,47,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A101D; --panel:#121B2D; --panel2:#182339; --line:#233049; --ink:#E8EDF6; --muted:#8B99B2;
    --amber-text:#FFB824; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A101D; --panel:#121B2D; --panel2:#182339; --line:#233049; --ink:#E8EDF6; --muted:#8B99B2;
  --amber-text:#FFB824; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.display{font-family:"Big Shoulders Display","Arial Narrow","Franklin Gothic Medium",Impact,sans-serif;font-weight:800;letter-spacing:.005em}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-name{font-size:26px;line-height:1;text-transform:uppercase}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:26px;height:26px}
.mark i{border-radius:5px;display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;padding:19px 10px 17px;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tools{display:flex;gap:8px;flex:none;align-items:center}
.phase{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}
#view{padding-top:28px}

/* buttons and fields */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn-primary:hover{border-color:var(--amber);filter:brightness(1.06)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13.5px;font-weight:600}
.inp,.sel{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);min-height:40px}
.inp:focus,.sel:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber)}
.inp:disabled,.sel:disabled{opacity:.6}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card h2{font-size:26px;line-height:1.05;margin-bottom:4px;text-transform:uppercase}
.card h3{font-size:17px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.empty h3{color:var(--ink);margin-bottom:6px}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:12px 0 34px}
.hero h1{font-size:clamp(46px,7.2vw,92px);line-height:.9;text-transform:uppercase;margin-bottom:18px}
.lede{font-size:18px;max-width:46ch;color:var(--muted);margin-bottom:24px}
.board{background:var(--led-bg);border-radius:20px;padding:16px;border:1px solid rgba(255,255,255,.06);box-shadow:0 18px 40px rgba(6,12,26,.28)}
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.led{background:var(--led-tile);border-radius:12px;padding:12px 14px 6px;display:flex;flex-direction:column;min-width:0}
.led label{font-size:12.5px;color:var(--led-label);font-weight:500;line-height:1.25;min-height:32px}
.led input{appearance:textfield;-moz-appearance:textfield;width:100%;background:transparent;border:0;padding:0;color:var(--led);font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:58px;line-height:1.05;text-shadow:0 0 22px rgba(255,184,36,.32);min-width:0}
.led input::-webkit-outer-spin-button,.led input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.led input:focus{outline:2px solid var(--led);outline-offset:2px;border-radius:6px}
.led.neg input{color:var(--led-neg);text-shadow:0 0 22px rgba(255,123,123,.3)}
.board-note{color:var(--led-label);font-size:12.5px;padding:12px 6px 2px}

/* crest + tiles */
.crest{flex:none;display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:10px}
.tile{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.tile.off{opacity:.5}
.tile-main{min-width:0;flex:1}
.tile-city{font-size:12px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-nick{font-weight:700;font-size:15.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{font-weight:700;color:var(--sc)}
.tile-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.rec{font-size:22px;line-height:1;font-weight:700}
.pct{font-size:12px;color:var(--muted);line-height:1}
.owner-tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;margin-top:2px}

.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:12.5px;color:#0E1424;flex:none}
.avatar.lg{width:38px;height:38px;font-size:16px}
.avatar.dim{opacity:.4}

/* controls bars */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.s-NFL[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--nfl)}
.seg button.s-MLB[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--mlb)}
.seg button.s-NBA[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--nba)}
.seg button.s-NHL[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--nhl)}
.bar .inp{width:230px}
.bar .sel{width:auto}
.grow{flex:1}

/* draft */
.clock{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;margin-bottom:20px;background:var(--led-bg);border-color:rgba(255,255,255,.06);color:#E8EDF6}
.clock .kicker{font-size:13px;color:var(--led-label)}
.clock-name{font-size:clamp(38px,5vw,60px);line-height:1;color:var(--led);text-shadow:0 0 24px rgba(255,184,36,.3);text-transform:uppercase}
.clock .sub{color:var(--led-label);font-size:14px}
.clock .btn{background:#17223B;border-color:#26345A;color:#E8EDF6}
.clock .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.draft-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.side .card{padding:16px}
.picklog{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pl{display:flex;align-items:center;gap:10px;font-size:13.5px}
.pl b{font-weight:700}
.pl .n{width:24px;color:var(--muted);font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
.bd td{padding:6px 8px;min-width:96px}
.bd th{min-width:96px}
.bd .c{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.bd .now{outline:2px solid var(--amber);outline-offset:-2px;background:color-mix(in srgb,var(--amber) 14%,transparent)}
.bd .rn{color:var(--muted);font-size:12.5px;width:44px;background:var(--panel2)}

/* lineup */
.lineup{display:flex;flex-direction:column;gap:14px}
.l4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lcol{display:flex;flex-direction:column;gap:8px}
.lh{font-weight:700;font-size:13.5px;padding-bottom:6px;border-bottom:3px solid var(--sc)}
.l3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.l6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ltitle{font-weight:700;font-size:13.5px;margin-bottom:8px}
.slot{appearance:none;position:relative;display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;min-width:0;width:100%}
.slot.empty-s{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.slot.sel{outline:2px solid var(--amber);outline-offset:1px}
.slot.can{border-color:var(--amber)}
.slot.static{cursor:default}
.slot .st{min-width:0;flex:1;display:flex;flex-direction:column}
.slot .tag{font-size:11.5px;color:var(--muted);line-height:1.2}
.slot .nm{font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sub{font-size:12px;color:var(--muted);line-height:1.2}
.slot .open{font-size:13px;font-weight:600}
.pts{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:22px;line-height:1;flex:none}
.pts.pos{color:var(--good)} .pts.neg{color:var(--bad)} .pts.zero{color:var(--muted)}
.lineup.compact .slot{min-height:0;padding:6px;justify-content:center}
.lineup.compact .slot .st,.lineup.compact .slot .pts{display:none}
.lineup.compact .l4{gap:6px}
.lineup.compact .l3,.lineup.compact .l6{gap:5px}
.lineup.compact .lcol{gap:5px}
.lineup.compact .lh{font-size:12px;padding-bottom:4px}
.lineup.compact .ltitle{font-size:12px;margin-bottom:5px}
.lineup.compact .slot.empty-s{min-height:42px}
.lineup.compact .l6{grid-template-columns:repeat(6,1fr)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{appearance:none;display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.pill[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 35%,transparent)}
.pill small{color:var(--muted);font-weight:500}
.rhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin:18px 0}
.big-total{background:var(--led-bg);border-radius:14px;padding:8px 18px;display:flex;align-items:baseline;gap:10px}
.big-total b{font-size:40px;line-height:1;color:var(--led)}
.big-total span{color:var(--led-label);font-size:13px}

/* managers list */
.mgr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mgr .ord{width:34px;color:var(--muted);font-size:12.5px;flex:none;text-align:right}

/* weeks + matchups */
.weeks{display:flex;gap:6px;flex-wrap:wrap}
.wk{appearance:none;min-width:40px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk.done:not([aria-pressed="true"]){border-color:var(--good);color:var(--good)}
.mlist{display:flex;flex-direction:column;gap:14px}
.mu{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.mu-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:18px 20px}
.side-m{display:flex;align-items:center;gap:12px;min-width:0}
.side-m.r{flex-direction:row-reverse;text-align:right}
.side-m .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-m .rc{font-size:13px;color:var(--muted)}
.scorepair{display:flex;align-items:center;gap:10px;background:var(--led-bg);padding:8px 14px;border-radius:12px}
.scorepair .sc{font-size:40px;line-height:1;min-width:2.4ch;text-align:center;color:var(--led)}
.scorepair .sc.neg{color:var(--led-neg)}
.scorepair .sc.lose{opacity:.55}
.scorepair .vs{color:var(--led-label);font-size:12px}
.mu-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;border-top:1px solid var(--line);background:var(--panel2);font-size:13px;color:var(--muted)}
.mu-foot button{appearance:none;background:none;border:0;color:var(--ink);font-weight:600;cursor:pointer;padding:4px 0}
.mu-detail{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.mu-detail>div{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.mu-detail>div+div{border-left:1px solid var(--line)}
.dl{display:flex;align-items:center;gap:10px}
.dl .t{min-width:0;flex:1}
.dl .t b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .t span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}

/* stat entry */
.stat-in{width:64px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);text-align:center;min-height:34px}
.stat-in:disabled{opacity:.5}
.sec-h td{background:var(--panel2);font-weight:700;color:var(--ink);border-left:4px solid var(--sc)}
.tcell{display:flex;align-items:center;gap:10px;font-weight:600}
td.pt{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:22px}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:2px 0 14px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(6,10,20,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(640px,100%);max-height:90vh;overflow:auto}
.modal textarea{width:100%;min-height:200px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:10px;font:12.5px ui-monospace,Menlo,Consolas,monospace;resize:vertical}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .hero{grid-template-columns:1fr;gap:26px}
  .draft-layout{grid-template-columns:1fr}
  .side{position:static}
  .grid2{grid-template-columns:1fr}
  .l4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .l6{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .topin{gap:10px;padding:0 12px;flex-wrap:wrap;min-height:0}
  .brand{padding-top:10px}
  .tools{padding-top:10px;margin-left:auto}
  .tabs{order:3;flex-basis:100%}
  .tab{padding:10px 10px 9px}
  .wrap{padding:0 12px 80px}
  .card{padding:16px}
  .board-grid{grid-template-columns:repeat(2,1fr)}
  .led input{font-size:48px}
  .mu-top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .side-m,.side-m.r{flex-direction:column;text-align:center}
  .mu-detail{grid-template-columns:1fr}
  .mu-detail>div+div{border-left:0;border-top:1px solid var(--line)}
  .l3{grid-template-columns:1fr}
  .l4{grid-template-columns:1fr}
  .l6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phase{display:none}
  .lineup.compact .l4{grid-template-columns:repeat(2,1fr)}
  .lineup.compact .l3{grid-template-columns:repeat(3,1fr)}
  .lineup.compact .l6{grid-template-columns:repeat(6,1fr)}
  .bar .inp{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v2 additions */
.strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:18px;font-weight:600;font-size:14px}
.strip.hot{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--panel))}
img.avatar{object-fit:cover;background:var(--panel2);border:1px solid var(--line);display:inline-block}
.avatar.xl{width:76px;height:76px;font-size:30px}
.ident{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.copyrow{display:flex;gap:8px}
.copyrow .inp{flex:1;min-width:0}
/* v3 additions: trades and chat */
.tab{padding-left:9px;padding-right:9px}
.dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11.5px;font-weight:700;margin-left:6px;line-height:18px;text-align:center}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{appearance:none;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.tchip span{display:flex;flex-direction:column;line-height:1.15}
.tchip b{font-size:13.5px}
.tchip small{font-size:11.5px;color:var(--muted)}
.tchip[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--panel));box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 30%,transparent)}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.tside{display:flex;flex-direction:column;gap:8px;min-width:0}
.tsh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:8px}
.tl span{display:flex;flex-direction:column;line-height:1.15}
.tl small{font-size:11.5px;color:var(--muted)}
.tarrow{align-self:center;color:var(--muted);font-size:13px;font-weight:600}
.tmsg{margin-top:10px;font-size:14px;color:var(--muted)}
.chat-list{height:min(58vh,520px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .bub{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:min(620px,86%);min-width:0}
.msg.me .bub{background:color-mix(in srgb,var(--amber) 15%,var(--panel));border-color:color-mix(in srgb,var(--amber) 60%,var(--line))}
.msg .meta{font-size:12px;color:var(--muted)}
.msg .meta b{color:var(--ink)}
.msg .mt{overflow-wrap:anywhere;white-space:pre-wrap}
.sysmsg{text-align:center;font-size:13px;color:var(--muted);padding:2px 8px}
.linkbtn{appearance:none;background:none;border:0;padding:0 0 0 6px;color:var(--bad);font-size:12px;cursor:pointer;text-decoration:underline}
@media (max-width:1180px){.phase{display:none}}
@media (max-width:640px){.tgrid{grid-template-columns:1fr}.tarrow{justify-self:center}}
.phase:empty{display:none}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function lum(hex){var v=parseInt(hex,16),r=(v>>16&255)/255,g=(v>>8&255)/255,b=(v&255)/255;var f=function(c){return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);};return .2126*f(r)+.7152*f(g)+.0722*f(b);}

/* ---------- lineups (derived from picks plus the manager's saved arrangement) ---------- */
function held(){return S.holdings||S.picks;}
function rosterKeys(mid){return held().filter(function(p){return p.mid===mid;}).map(function(p){return p.key;});}
function computeHoldings(st){
  var done=(st.trades||[]).filter(function(t){return t.st==='done';}).sort(function(a,b){return (a.doneAt||0)-(b.doneAt||0);});
  if(!done.length)return null;
  var h=st.picks.map(function(p){return {mid:p.mid,key:p.key};});
  function idx(mid,key){for(var i=0;i<h.length;i++){if(h[i].mid===mid&&h[i].key===key)return i;}return -1;}
  done.forEach(function(t){
    var ok=t.g.every(function(k){return idx(t.f,k)>=0&&idx(t.t,k)<0;})&&t.r.every(function(k){return idx(t.t,k)>=0&&idx(t.f,k)<0;});
    if(!ok)return;
    t.g.forEach(function(k){h.splice(idx(t.f,k),1);});t.r.forEach(function(k){h.splice(idx(t.t,k),1);});
    t.g.forEach(function(k){h.push({mid:t.t,key:k});});t.r.forEach(function(k){h.push({mid:t.f,key:k});});
  });
  return h;
}
function syncHoldings(st){st.holdings=computeHoldings(st);}
function placeInto(L,key){
  var sp=TEAM[key].sport;
  var order=SLOTS.filter(function(s){return s.type==='core'&&s.sport===sp;})
    .concat(SLOTS.filter(function(s){return s.type==='flex'&&s.sports.length===2&&s.sports.indexOf(sp)>=0;}))
    .concat([SLOT.FXC]).concat(SLOTS.filter(function(s){return s.type==='bench';}));
  for(var i=0;i<order.length;i++){if(!L[order[i].id]){L[order[i].id]=key;return;}}
}
function getLineup(mid){
  var base=S.lineups[mid]||{},owned=rosterKeys(mid),L={},used={};
  Object.keys(base).forEach(function(sid){var k=base[sid];if(SLOT[sid]&&TEAM[k]&&owned.indexOf(k)>=0&&!used[k]&&SLOT[sid].sports.indexOf(TEAM[k].sport)>=0){L[sid]=k;used[k]=1;}});
  owned.forEach(function(k){if(!used[k]){placeInto(L,k);used[k]=1;}});
  return L;
}

/* ---------- scoring ---------- */
function teamPts(sport,st){
  var r=S.scoring,ev=sport==='NFL'?r.td:sport==='NBA'?0:r.goal;
  return st.w*r.win+st.l*r.loss+st.ot*r.ot+st.so*r.so+st.ev*ev;
}
function statLine(sport,st){
  if(!st)return 'No games entered';
  var p=[st.w+'-'+st.l];if(st.ot)p.push(st.ot+' OT');if(st.so)p.push(st.so+' SO');
  var e=META[sport].ev;if(e&&st.ev)p.push(st.ev+' '+e);return p.join(', ');
}
function starters(){return SLOTS.filter(function(s){return s.type!=='bench';});}
function weekPoints(mid,w,lineup){
  var L=lineup||getLineup(mid),st=S.stats[w]||{},total=0,rows=[];
  starters().forEach(function(s){var k=L[s.id];if(!k)return;var t=TEAM[k],x=st[k],p=x?teamPts(t.sport,x):0;total+=p;rows.push({slot:s.id,key:k,pts:p,st:x});});
  return {total:total,rows:rows};
}
function seasonPts(key){var t=0;for(var w in S.stats){var x=S.stats[w][key];if(x)t+=teamPts(TEAM[key].sport,x);}return t;}

/* ---------- draft logic ---------- */
function ownerCounts(){var o={};S.picks.forEach(function(p){o[p.key]=(o[p.key]||0)+1;});return o;}
function sportCounts(mid,extra){var c={NFL:0,MLB:0,NBA:0,NHL:0};rosterKeys(mid).forEach(function(k){c[TEAM[k].sport]++;});if(extra)c[extra]++;return c;}
function onClock(){
  var p=S.picks.length,N=n();if(!N||p>=N*ROSTER)return null;
  var round=Math.floor(p/N),pos=p%N;if(S.snake&&round%2===1)pos=N-1-pos;
  return {mid:S.managers[pos].id,round:round+1,pick:p%N+1,overall:p+1};
}
function mgrAtPick(p){var N=n(),round=Math.floor(p/N),pos=p%N;if(S.snake&&round%2===1)pos=N-1-pos;return S.managers[pos];}
function canFill(mid,sport){
  var c=sportCounts(mid,sport),made=rosterKeys(mid).length+1,rem=ROSTER-made,need=0,ex={};
  SPORTS.forEach(function(s){need+=Math.max(0,CORE-c[s]);ex[s]=Math.max(0,c[s]-CORE);});
  var E=ex.NFL+ex.MLB+ex.NBA+ex.NHL,a=Math.min(1,ex.NFL+ex.MLB),b=Math.min(1,ex.NBA+ex.NHL),cc=Math.min(1,E-a-b);
  return need+(3-a-b-cc)<=rem;
}
function globalCoreOK(sport,mid){
  var owners=ownerCounts();
  for(var i=0;i<SPORTS.length;i++){
    var s=SPORTS[i],need=0,avail=0;
    S.managers.forEach(function(m){need+=Math.max(0,CORE-sportCounts(m.id,m.id===mid?sport:null)[s]);});
    TEAMS.forEach(function(t){if(t.sport===s)avail+=S.maxOwners-(owners[t.key]||0);});
    if(s===sport)avail-=1;
    if(need>avail)return false;
  }
  return true;
}
function allowedSports(mid){var r={};SPORTS.forEach(function(s){r[s]=canFill(mid,s)&&globalCoreOK(s,mid);});return r;}
function availableTeams(mid){
  var o=ownerCounts(),mine=rosterKeys(mid);
  return TEAMS.filter(function(t){return (o[t.key]||0)<S.maxOwners&&mine.indexOf(t.key)<0;});
}
function eligibleTeams(mid){var al=allowedSports(mid),av=availableTeams(mid),ok=av.filter(function(t){return al[t.sport];});return ok.length?ok:av;}
function canPickNow(){var oc=onClock();return !!oc&&(MODE!=='live'||IS_ADMIN||oc.mid===ME);}

/* every change to the draft goes through here so live and local modes stay in step */
function applyPicks(mutator){
  var backup=S.picks.slice();mutator();var list=S.picks.slice();
  if(MODE==='live')S.picks=backup;
  commitPicks(list,backup.length);
}
function commitPicks(list,baseLen){
  if(MODE==='live'){
    if((RAWL.picks||[]).length!==baseLen){toast('Someone else just made a pick. Refreshing the board.');rebuildLive();render(true);return;}
    dbSet('draft/picks',{l:list.map(function(p){return {m:p.mid,k:p.key};})});
    return;
  }
  S.picks=list.map(function(p,i){return {mid:p.mid,key:p.key,n:i+1};});
  S.phase=S.picks.length>=n()*ROSTER?'season':'draft';
  save();
}
function pushPick(key){var oc=onClock();if(oc)S.picks.push({mid:oc.mid,key:key,n:oc.overall});}
function autoPickOne(){
  var oc=onClock();if(!oc)return;
  var pool=eligibleTeams(oc.mid).sort(function(a,b){return b.strength-a.strength;}).slice(0,5);
  if(pool.length)pushPick(pool[Math.floor(Math.random()*pool.length)].key);
}
function makeSchedule(ids,weeks){
  var list=ids.slice();if(list.length%2)list.push(null);
  var m=list.length,arr=list.slice(),rounds=[];
  for(var r=0;r<m-1;r++){
    var pairs=[];
    for(var i=0;i<m/2;i++){var a=arr[i],b=arr[m-1-i];if(a===null){a=b;b=null;}pairs.push([a,b]);}
    rounds.push(pairs);arr=[arr[0],arr[m-1]].concat(arr.slice(1,m-1));
  }
  var out=[];for(var w=0;w<weeks;w++)out.push(rounds[w%rounds.length]);return out;
}
function schedToObj(sch){var o={};sch.forEach(function(pairs,i){o[i+1]=pairs.map(function(p){return {a:p[0],b:p[1]||''};});});return o;}
function objToSched(o,weeks){var out=[];for(var w=1;w<=weeks;w++){out.push(((o&&o[w])||[]).map(function(p){return [p.a,p.b||null];}));}return out;}

/* ---------- simulation ---------- */
function pois(mean){var L=Math.exp(-mean),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function playGame(sp,a,b,stats){
  var pa=1/(1+Math.exp(-(a.strength-b.strength)*5)),aw=Math.random()<pa,W=aw?a:b,Lz=aw?b:a;
  var P={NFL:{ot:.06,so:.03,mw:2.9,ml:1.5},MLB:{ot:.09,so:.07,mw:1.5,ml:.7},NBA:{ot:.06,so:0,mw:0,ml:0},NHL:{ot:.22,so:.07,mw:3.4,ml:1.9}}[sp];
  var ot=Math.random()<P.ot,so=!ot&&Math.random()<P.so,ew=P.mw?pois(P.mw):0,el=P.ml?pois(P.ml):0;
  if(so)el=0;if(P.mw&&ew<el)ew=el;if(so&&P.mw&&ew===0)ew=1;
  stats[W.key].w++;stats[Lz.key].l++;
  if(ot){stats[W.key].ot++;stats[Lz.key].ot++;}
  if(so)stats[W.key].so++;
  stats[W.key].ev+=ew;stats[Lz.key].ev+=el;
}
function simWeek(w){
  var stats={};TEAMS.forEach(function(t){stats[t.key]={w:0,l:0,ot:0,so:0,ev:0};});
  SPORTS.forEach(function(sp){
    var teams=TEAMS.filter(function(t){return t.sport===sp;});
    for(var g=0;g<META[sp].gpw;g++){var arr=shuffle(teams.slice());for(var i=0;i+1<arr.length;i+=2)playGame(sp,arr[i],arr[i+1],stats);}
  });
  S.stats[w]=stats;
}
function buildFinal(w){
  var f={lineups:{},scores:{},detail:{}};
  S.managers.forEach(function(m){var L=clean(getLineup(m.id)),r=weekPoints(m.id,w,L);f.lineups[m.id]=L;f.scores[m.id]=r.total;f.detail[m.id]=r.rows;});
  return f;
}
function standings(){
  var rec={};S.managers.forEach(function(m){rec[m.id]={mid:m.id,w:0,l:0,t:0,pf:0,pa:0};});
  Object.keys(S.final).forEach(function(k){
    var f=S.final[k];(S.schedule[+k-1]||[]).forEach(function(pr){
      var a=pr[0],b=pr[1];if(!b||!rec[a]||!rec[b])return;var sa=f.scores[a]||0,sb=f.scores[b]||0;
      rec[a].pf+=sa;rec[a].pa+=sb;rec[b].pf+=sb;rec[b].pa+=sa;
      if(sa>sb){rec[a].w++;rec[b].l++;}else if(sb>sa){rec[b].w++;rec[a].l++;}else{rec[a].t++;rec[b].t++;}
    });
  });
  return Object.keys(rec).map(function(k){return rec[k];}).sort(function(x,y){return (y.w+y.t/2)-(x.w+x.t/2)||y.pf-x.pf;});
}
function recordOf(mid){var r=standings().filter(function(x){return x.mid===mid;})[0];return r?r.w+'-'+r.l+(r.t?'-'+r.t:''):'0-0';}

/* ---------- live sync layer ---------- */
var WQ={};
function dbSet(path,data){
  var p=(WQ[path]||Promise.resolve()).then(function(){return DB.doc(path).set(clean(data));}).catch(function(e){toast((e&&e.code)==='permission-denied'?'You don\'t have permission to do that.':'Could not save that change ('+((e&&e.code)||'error')+').');});
  WQ[path]=p;return p;
}
function dbDelete(path){return DB.doc(path).delete().catch(function(){});}
function rebuildLive(){
  var c=Object.assign({},RAWL.cfg||{},OVER.cfg),st=defaultState(),mem=RAWL.members;
  st.name=c.name||'My Franchise League';st.phase=c.phase||'setup';
  st.weeks=c.weeks||8;st.snake=c.snake!==false;st.maxOwners=c.maxOwners||1;
  st.scoring=Object.assign(st.scoring,c.scoring||{});
  var ids=Object.keys(mem).sort(function(a,b){return (mem[a].at||0)-(mem[b].at||0);});
  var order=(c.order||[]).filter(function(id){return mem[id];});
  ids.forEach(function(id){if(order.indexOf(id)<0)order.push(id);});
  st.managers=order.map(function(id){var ov=OVER.member[id];return {id:id,name:ov&&ov.team!==undefined?ov.team:(mem[id].team||'Team'),logo:mem[id].logo||''};});
  var valid={};st.managers.forEach(function(m){valid[m.id]=1;});
  st.picks=(RAWL.picks||[]).filter(function(p){return valid[p.m]&&TEAM[p.k];}).map(function(p,i){return {mid:p.m,key:p.k,n:i+1};});
  Object.keys(RAWL.lineups).forEach(function(id){st.lineups[id]=RAWL.lineups[id];});
  Object.keys(RAWL.stats).forEach(function(w){
    if(OVER.stats[w]&&S.stats[w]){st.stats[w]=S.stats[w];return;}
    var o={};Object.keys(RAWL.stats[w]).forEach(function(k){var a=RAWL.stats[w][k];o[k]={w:a[0],l:a[1],ot:a[2],so:a[3],ev:a[4]};});st.stats[w]=o;
  });
  Object.keys(OVER.stats).forEach(function(w){if(OVER.stats[w]&&!st.stats[w]&&S.stats[w])st.stats[w]=S.stats[w];});
  Object.keys(RAWL.final).forEach(function(w){st.final[w]=RAWL.final[w];});
  st.maxManagers=c.maxManagers||6;st.tradeApproval=!!c.tradeApproval;
  st.trades=Object.keys(RAWL.trades).map(function(id){return RAWL.trades[id];}).sort(function(a,b){return (a.at||0)-(b.at||0);});
  st.holdings=computeHoldings(st);
  st.schedule=objToSched(c.schedule,st.weeks);
  if(st.phase==='draft'&&st.managers.length&&st.picks.length>=st.managers.length*ROSTER)st.phase='season';
  SL=st;if(MODE==='live')S=SL;
}
function writeMember(id,patch){
  var cur=Object.assign({},RAWL.members[id]||{},patch);RAWL.members[id]=cur;
  return dbSet('members/'+id,cur);
}
function commitStats(w){
  if(MODE!=='live'){save();return;}
  var t={},st=S.stats[w]||{};
  Object.keys(st).forEach(function(k){var x=st[k];if(x.w||x.l||x.ot||x.so||x.ev)t[k]=[x.w,x.l,x.ot,x.so,x.ev];});
  var w0=w;OVER.stats[w]=true;
  dbSet('stats/w'+w,{t:t}).then(function(){delete OVER.stats[w0];RAWL.stats[w0]=t;rebuildLive();});
}
function applyCfg(patch){
  if(MODE!=='live'){Object.keys(patch).forEach(function(k){S[k]=patch[k];});save();return;}
  Object.assign(OVER.cfg,patch);rebuildLive();
  debounce('cfg',flushCfg,450);
}
function flushCfg(){
  var patch=Object.assign({},OVER.cfg);if(!Object.keys(patch).length)return;
  dbSet('league/main',Object.assign({},RAWL.cfg||{},patch)).then(function(){
    RAWL.cfg=Object.assign({},RAWL.cfg||{},patch);
    Object.keys(patch).forEach(function(k){if(JSON.stringify(OVER.cfg[k])===JSON.stringify(patch[k]))delete OVER.cfg[k];});
    rebuildLive();renderSoon();
  });
}
function setLineup(mid,L){
  S.lineups[mid]=L;
  if(MODE==='live'){RAWL.lineups[mid]=L;dbSet('lineups/'+mid,{s:L});}else save();
}

var FIRST={},LIVE_READY=false,PREV_TURN=null,PREV_PHASE=null,RS=null;
function gotFirst(k){
  FIRST[k]=1;
  if(!LIVE_READY&&FIRST.cfg&&FIRST.members&&FIRST.picks&&FIRST.lineups&&FIRST.stats&&FIRST.final&&FIRST.trades&&FIRST.chat)liveReady();
}
function liveReady(){
  if(LIVE_READY)return;LIVE_READY=true;LIVE_AVAILABLE=true;
  if(BACKEND==='firebase'){try{var lg=JSON.parse(localStorage.getItem('ff-leagues')||'[]').filter(function(x){return x.id!==LID;});lg.unshift({id:LID,name:(RAWL.cfg&&RAWL.cfg.name)||'League'});localStorage.setItem('ff-leagues',JSON.stringify(lg.slice(0,8)));}catch(e){}}
  if(MODE==='loading')MODE='live';
  rebuildLive();
  if(MODE==='live'){
    UI.week=firstOpenWeek();
    UI.tab=S.phase==='draft'?'draft':S.phase==='season'?'matchups':'league';
    PREV_PHASE=S.phase;var oc=onClock();PREV_TURN=oc?oc.mid:null;
    if(oc&&oc.mid===ME&&S.phase==='draft')toast('You\'re on the clock.');
  }
  refreshProfiles();render();
}
function onLiveChange(){
  if(!LIVE_READY)return;
  rebuildLive();refreshProfiles();
  if(MODE==='live'){
    var oc=onClock(),mid=oc?oc.mid:null;
    if(S.phase==='draft'&&mid&&mid!==PREV_TURN&&mid===ME)toast('You\'re on the clock.');
    if(PREV_PHASE==='setup'&&S.phase==='draft'&&UI.tab==='league'){UI.tab='draft';UI.view='pool';toast('The draft has started.');}
    if(PREV_PHASE==='draft'&&S.phase==='season'&&UI.tab==='draft'){UI.tab='rosters';toast('The draft is complete. Set your lineup.');}
    PREV_TURN=mid;PREV_PHASE=S.phase;
  }
  renderSoon();
}
function refreshProfiles(){
  if(BACKEND==='firebase'){
    var np={};Object.keys(RAWL.members).forEach(function(id){np[id]=RAWL.members[id].who||'';});
    if(RAWL.cfg&&RAWL.cfg.admin&&!np[RAWL.cfg.admin])np[RAWL.cfg.admin]=RAWL.cfg.adminName||'';
    if(JSON.stringify(np)!==JSON.stringify(PROF)){PROF=np;renderSoon();}
    return;
  }
  if(!USER)return;var ids=Object.keys(RAWL.members);if(ME&&ids.indexOf(ME)<0)ids.push(ME);(RAWL.chat||[]).forEach(function(m){if(m.u&&ids.indexOf(m.u)<0)ids.push(m.u);});if(!ids.length)return;
  USER.profiles(ids).then(function(ps){
    var np={};ids.forEach(function(id){np[id]=(ps[id]&&ps[id].name)||'';});
    if(JSON.stringify(np)!==JSON.stringify(PROF)){PROF=np;renderSoon();}
  });
}
function subErr(e){var c=(e&&e.code)||'error';toast(c==='permission-denied'?'Firestore is blocking this request. Publish firestore.rules in your Firebase project.':'Live sync problem ('+c+').');}
function subscribeAll(){
  DB.doc('league/main').onSnapshot(function(s){RAWL.cfg=s.exists?s.data():null;if(BACKEND==='firebase')IS_ADMIN=!!(RAWL.cfg&&RAWL.cfg.admin===ME);gotFirst('cfg');onLiveChange();},subErr);
  DB.doc('draft/picks').onSnapshot(function(s){var d=s.exists?s.data():null;RAWL.picks=d&&Array.isArray(d.l)?d.l:[];gotFirst('picks');onLiveChange();},subErr);
  DB.collection('members').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=d.data();});RAWL.members=m;gotFirst('members');onLiveChange();},subErr);
  DB.collection('lineups').onSnapshot(function(q){var m={};q.docs.forEach(function(d){var x=d.data();if(x&&x.s)m[d.id]=x.s;});RAWL.lineups=m;gotFirst('lineups');onLiveChange();},subErr);
  DB.collection('stats').onSnapshot(function(q){var m={};q.docs.forEach(function(d){var x=d.data();if(x&&x.t)m[+d.id.slice(1)]=x.t;});RAWL.stats=m;gotFirst('stats');onLiveChange();},subErr);
  DB.collection('final').onSnapshot(function(q){var m={};q.docs.forEach(function(d){var x=d.data();if(x&&x.scores)m[+d.id.slice(1)]=x;});RAWL.final=m;gotFirst('final');onLiveChange();},subErr);
  DB.collection('trades').onSnapshot(function(q){var m={};q.docs.forEach(function(d){var x=d.data();if(x&&x.f&&x.t)m[d.id]=Object.assign({id:d.id},x);});RAWL.trades=m;gotFirst('trades');onLiveChange();},subErr);
  DB.collection('chat').orderBy('at','desc').limit(200).onSnapshot(function(q){RAWL.chat=q.docs.map(function(d){return Object.assign({id:d.id},d.data());});gotFirst('chat');onLiveChange();},subErr);
  setTimeout(function(){if(!LIVE_READY)liveReady();},4000);
}
function startClaude(){

    DB=r[0];USER=r[1];

function startLive(){if(BACKEND==='claude')startClaude();else if(BACKEND==='firebase')startFirebase();}
function fbFail(msg){LOAD_ERR=msg;MODE='loading';render();}
function startFirebase(){
  LID=(new URLSearchParams(location.search).get('l')||'').replace(/[^a-zA-Z0-9]/g,'').slice(0,40);
  if(!LID){MODE='landing';render();return;}
  MODE='loading';LOAD_ERR='';render();
  var fs,au;
  try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);fs=firebase.firestore();au=firebase.auth();}
  catch(e){fbFail('Could not start Firebase. Check the config block at the top of index.html.');return;}
  function pref(p){return 'leagues/'+LID+'/'+p;}
  function wDoc(s){return {id:s.id,exists:typeof s.exists==='function'?s.exists():!!s.exists,data:function(){return s.data();}};}
  function wQ(q){return {docs:q.docs.map(wDoc),size:q.size,empty:q.empty};}
  function wCol(c){return {orderBy:function(f,d){return wCol(c.orderBy(f,d));},limit:function(k){return wCol(c.limit(k));},get:function(){return c.get().then(wQ);},onSnapshot:function(nx,er){return c.onSnapshot(function(q){nx(wQ(q));},er);}};}
  DB={
    doc:function(p){var r=fs.doc(pref(p));return {set:function(d){return r.set(d);},delete:function(){return r.delete();},get:function(){return r.get().then(wDoc);},onSnapshot:function(nx,er){return r.onSnapshot(function(s){nx(wDoc(s));},er);}};},
    collection:function(p){return wCol(fs.collection(pref(p)));}
  };
  try{ME_NAME=localStorage.getItem('ff-name')||'';}catch(e){}
  var started=false;
  au.onAuthStateChanged(function(u){
    if(!u){au.signInAnonymously().catch(function(e){fbFail('Sign-in failed ('+((e&&e.code)||'error')+'). In Firebase, open Authentication, then Sign-in method, and turn on Anonymous.');});return;}
    ME=u.uid;
    if(!started){started=true;try{CHAT_SEEN=+(localStorage.getItem('ff-seen-'+ME)||0);}catch(e){}subscribeAll();}
  });
}
function newLeague(){
  var a=new Uint8Array(6);(window.crypto||window.msCrypto).getRandomValues(a);
  var id=Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
  location.search='?l='+id;
}

function linkGoogle(){
  if(BACKEND!=='firebase')return;
  var au=firebase.auth(),u=au.currentUser;if(!u)return;

UI.trade={from:null,to:null,give:[],get:[],msg:''};UI.chatDraft='';
var CHAT_SEEN=0;
function tradeById(id){return (S.trades||[]).filter(function(t){return t.id===id;})[0];}
function saveTrade(tr){
  if(MODE==='live'){RAWL.trades[tr.id]=tr;dbSet('trades/'+tr.id,tr);rebuildLive();}
  else{
    S.trades=S.trades||[];var i=-1;S.trades.forEach(function(t,j){if(t.id===tr.id)i=j;});
    if(i>=0)S.trades[i]=tr;else S.trades.push(tr);syncHoldings(S);save();
  }
}
function tradeValid(tr){
  if(!tr.g.length||tr.g.length!==tr.r.length)return 'A trade needs the same number of teams on each side.';
  var hf=rosterKeys(tr.f),ht=rosterKeys(tr.t),i,k;
  for(i=0;i<tr.g.length;i++){k=tr.g[i];if(hf.indexOf(k)<0)return 'One of the offered teams is no longer on that roster.';if(ht.indexOf(k)>=0)return 'The other manager already owns one of the offered teams.';}
  for(i=0;i<tr.r.length;i++){k=tr.r[i];if(ht.indexOf(k)<0)return 'One of the requested teams is no longer on that roster.';if(hf.indexOf(k)>=0)return 'You already own one of the requested teams.';}
  return '';
}

function tradeAct(id,what){
  var tr=tradeById(id);if(!tr)return;
  var live=MODE==='live',comm=isComm();
  if(what==='accept'&&tr.st==='pending'&&(!live||tr.t===ME)){
    var err=tradeValid(tr);

    else if(live&&S.tradeApproval&&!IS_ADMIN){tr.st='review';saveTrade(tr);toast('Accepted. The commissioner needs to approve it.');}
    else completeTrade(tr);
  }else if(what==='decline'&&tr.st==='pending'&&(!live||tr.t===ME)){tr.st='declined';saveTrade(tr);}
  else if(what==='cancel'&&(tr.st==='pending'||tr.st==='review')&&(!live||tr.f===ME||IS_ADMIN)){tr.st='cancelled';saveTrade(tr);}
  else if(what==='approve'&&tr.st==='review'&&comm)completeTrade(tr);

}

function processLogo(file,cb){
  if(!file||file.type.indexOf('image/')!==0){toast('Choose an image file.');return;}
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),sz=160;c.width=c.height=sz;
      var ctx=c.getContext('2d'),m=Math.min(img.width,img.height)||1;
      ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);
      var url=c.toDataURL('image/webp',.85);if(url.indexOf('image/webp')<0)url=c.toDataURL('image/jpeg',.88);
      cb(url);
    };
    img.onerror=function(){toast('That image couldn\'t be read.');};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function act(a,el){

    case 'rm-mgr':
      if(MODE==='live'){if(isComm()&&S.phase==='setup'){var rid=el.dataset.id;delete RAWL.members[rid];dbDelete('members/'+rid);rebuildLive();rerender();}}

    case 'undo':if(isComm()&&S.picks.length){applyPicks(function(){S.picks.pop();});rerender();}break;
    case 'view':UI.view=v;rerender();break;
    case 'pool':UI.pool=v;rerender();break;
    case 'sc':UI.sc=v;rerender();break;

    case 'finalize':if(isComm()){var w=UI.week,f=buildFinal(w);if(MODE==='live'){dbSet('final/w'+w,f);RAWL.final[w]=f;rebuildLive();}else{S.final[w]=f;save();}rerender();toast('Week '+w+' is final.');}break;
    case 'reopen':if(isComm()){var w2=UI.week;if(MODE==='live'){delete RAWL.final[w2];dbDelete('final/w'+w2);rebuildLive();}else{delete S.final[w2];save();}rerender();}break;
    case 'sim':if(isComm()){simWeek(UI.week);commitStats(UI.week);rerender();toast('Filled week '+UI.week+' with simulated results.');}break;

  }

    case 'poolsort':UI.sort=el.value;$('#pool').innerHTML=poolHtml();break;
    case 'tq':UI.tq=el.value;$('#stbl').innerHTML=scoresTable();break;
    case 'tq2':UI.tq=el.value;render(true);break;
    case 'rostered':UI.rostered=el.checked;$('#stbl').innerHTML=scoresTable();break;
    case 'week':UI.week=+el.value;rerender();break;
    case 'tradefrom':UI.trade.from=el.value;UI.trade.to=null;UI.trade.give=[];UI.trade.get=[];rerender();break;
    case 'tradeto':UI.trade.to=el.value;UI.trade.get=[];rerender();break;
    case 'trademsg':UI.trade.msg=el.value;break;
    case 'joinwho':UI.joinWho=el.value;break;
    case 'joinname':UI.joinName=el.value;break;
    case 'claimname':UI.claimName=el.value;break;
    case 'claimwho':UI.claimWho=el.value;break;
    case 'chatmsg':UI.chatDraft=el.value;break;
    case 'maxmgr':applyCfg({maxManagers:+el.value});rerender();break;
    case 'tradeapp':applyCfg({tradeApproval:el.value==='1'});break;
    case 'stat':{
      if(!isComm())return;
      var w=UI.week;if(S.final[w])return;var x=parseInt(el.value,10);if(isNaN(x)||x<0)x=0;if(x>99)x=99;
      var st=S.stats[w]=S.stats[w]||{};var r=st[el.dataset.key]=st[el.dataset.key]||{w:0,l:0,ot:0,so:0,ev:0};r[el.dataset.f]=x;
      var c=$('[data-pts="'+el.dataset.key+'"]');if(c)c.textContent=fmt(teamPts(TEAM[el.dataset.key].sport,r));
      if(MODE==='live'){OVER.stats[w]=true;debounce('st'+w,function(){commitStats(w);},600);}else save();
      break;
    }
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
  if(e.target.id==='logoFile'){
    var f=e.target.files&&e.target.files[0],id=UI.logoFor;e.target.value='';
    if(f&&id)processLogo(f,function(url){setLogo(id,url);});
    return;
  }
  var el=e.target.closest('[data-in]');if(!el)return;
  if(['weeks','snake','owners','poolsort','rostered','week','tradefrom','tradeto','maxmgr','tradeapp'].indexOf(el.dataset.in)>=0)onField(e);
});

/* theme */
try{var th=localStorage.getItem('ff-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
render();
startLive();
})();
</script>
</body>
</html>
